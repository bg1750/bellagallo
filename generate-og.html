<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Generate OG Image</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background: #111; display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 40px; font-family: 'Space Mono', monospace; color: #ccc; }
        canvas { border: 1px solid #333; max-width: 100%; }
        button { padding: 12px 32px; background: #9940FF; color: #000; border: none; font-family: 'Space Mono', monospace; font-size: 1em; letter-spacing: 2px; cursor: pointer; }
        button:hover { background: #7a2fd4; }
    </style>
</head>
<body>
    <p>Your OG image — click Download to save as PNG</p>
    <canvas id="canvas" width="1200" height="630"></canvas>
    <button onclick="download()">Download og-image.png</button>

    <!-- Small build tool (not part of the live site): draws the social-share preview
         image onto a canvas and lets me download it as og-image.png. -->
    <script>
        // async so we can wait for the web font before drawing the name.
        async function render() {
        await document.fonts.load('italic 96px "Instrument Serif"');

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        const W = 1200, H = 630;   // standard OG image size

        // Background
        ctx.fillStyle = '#0D0D0D';
        ctx.fillRect(0, 0, W, H);

        // Dot grid texture
        ctx.fillStyle = '#1E1E1E';
        for (let x = 0; x < W; x += 32) {
            for (let y = 0; y < H; y += 32) {
                ctx.beginPath();
                ctx.arc(x + 1, y + 1, 1, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Waves — matches the CSS mask (--size:50, --b:100, --m:0.5, band 34px).
        // Two interleaved grids of circles clipped to a thin band at each edge.
        function drawWave(isBottom) {
            const size   = 50;
            const waveH  = 34;
            const R      = size * Math.sqrt(0.5 * 0.5 + 1); // ≈ 55.9
            const p      = 0.5 * size;                        // 25
            const period = 4 * size;                          // 200

            const bandTop = isBottom ? H - waveH : 0;

            const g1y = isBottom ? H - waveH - p : waveH + p;
            const g2y = isBottom ? H        + p : 0    - p;

            ctx.save();
            ctx.beginPath();
            ctx.rect(0, bandTop, W, waveH);
            ctx.clip();

            ctx.globalAlpha = 0.2;
            ctx.fillStyle   = '#9940FF';

            const g1x0 = ((( W/2 - 100) % period) + period) % period;
            for (let x = g1x0 - period; x < W + period; x += period) {
                ctx.beginPath();
                ctx.arc(x, g1y, R, 0, Math.PI * 2);
                ctx.fill();
            }

            const g2x0 = (((W / 2) % period) + period) % period;
            for (let x = g2x0 - period; x < W + period; x += period) {
                ctx.beginPath();
                ctx.arc(x, g2y, R, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        drawWave(false);
        drawWave(true);

        // Border frame
        ctx.strokeStyle = 'rgba(153, 64, 255, 0.35)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.roundRect(40, 40, W - 80, H - 80, 6);
        ctx.stroke();

        // L-shaped corner brackets — each is [start, corner, end]
        ctx.strokeStyle = '#9940FF';
        ctx.lineWidth = 3;
        const corners = [
            [[40,80],[40,40],[80,40]],
            [[1160,80],[1160,40],[1120,40]],
            [[40,550],[40,590],[80,590]],
            [[1160,550],[1160,590],[1120,590]]
        ];
        corners.forEach(pts => {
            ctx.beginPath();
            ctx.moveTo(pts[0][0], pts[0][1]);
            ctx.lineTo(pts[1][0], pts[1][1]);
            ctx.lineTo(pts[2][0], pts[2][1]);
            ctx.stroke();
        });

        // Big faint BG monogram behind everything
        ctx.fillStyle = '#2E1155';
        ctx.font = 'italic 580px Georgia, serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'alphabetic';
        ctx.fillText('BG', W / 2, 500);

        // My name on top
        ctx.fillStyle = '#D4CFC9';
        ctx.font = 'italic 108px "Instrument Serif", serif';
        ctx.letterSpacing = '0px';
        ctx.fillText('Bella Gallo', W / 2, 390);

        // Title
        ctx.fillStyle = '#666666';
        ctx.font = '20px "Space Mono", monospace';
        ctx.letterSpacing = '6px';
        ctx.fillText('COMPUTER ENGINEER', W / 2, 435);

        // URL
        ctx.fillStyle = '#2E2E2E';
        ctx.font = '16px "Space Mono", monospace';
        ctx.letterSpacing = '2px';
        ctx.fillText('bg1750.github.io/bellagallo', W / 2, 585);

        }

        render();

        // Save the canvas as a PNG
        function download() {
            const link = document.createElement('a');
            link.download = 'og-image.png';
            link.href = document.getElementById('canvas').toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
